<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120d24">
<title>Plot Twist</title>
<meta name="description" content="Plot Twist — the group party game for 5–10 friends. Adventure, Mystery and Party modes on everyone's phone.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff5c7a'/%3E%3Cpath d='M18 44c6-18 22-6 28-24' stroke='%23120d24' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='46' cy='20' r='5' fill='%23ffcc4d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120d24; --bg2:#1a1333; --card:#211a3f; --card2:#2b2251; --line:#3a3066;
  --text:#f7f2ff; --muted:#b3a7d8; --dim:#7d72a6;
  --coral:#ff5c7a; --sun:#ffcc4d; --mint:#3ce0b0; --sky:#5cb8ff; --violet:#9b7bff;
  --adv:var(--mint); --mys:var(--violet); --par:var(--coral);
  --r:18px; --r-sm:12px;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(900px 500px at 110% -10%,rgba(255,92,122,.16),transparent 60%),
  radial-gradient(800px 500px at -20% 110%,rgba(92,184,255,.12),transparent 60%),var(--bg);background-attachment:fixed}
button,input{font:inherit;color:inherit}
a{color:var(--sky)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.wrap.wide{max-width:1080px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;text-decoration:none;color:var(--text)}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--coral);display:grid;place-items:center;font-style:normal}
.logo i svg{width:20px;height:20px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0}
h1{font-size:clamp(40px,11vw,64px);line-height:.95;font-weight:800}
h2{font-size:26px;font-weight:800;line-height:1.1}
h3{font-size:18px;font-weight:700}
p{line-height:1.5;margin:0}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:14px} .tiny{font-size:12px}
.stack>*+*{margin-top:12px} .stack-l>*+*{margin-top:20px}
.row{display:flex;gap:10px;align-items:center} .row.wrapr{flex-wrap:wrap} .between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.tight{padding:12px}
.btn{appearance:none;text-decoration:none;border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;cursor:pointer;background:var(--card2);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;transition:transform .08s ease,filter .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.block{width:100%}
.btn.primary{background:var(--coral);color:#1b0b14}
.btn.sun{background:var(--sun);color:#231a00}
.btn.mint{background:var(--mint);color:#04241b}
.btn.violet{background:var(--violet);color:#120a2c}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:8px 12px;font-size:14px;border-radius:10px}
.input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:17px;outline:none;min-height:52px}
.input:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(92,184,255,.18)}
.input.code{font-family:var(--display);font-weight:800;letter-spacing:.25em;text-transform:uppercase;font-size:22px;text-align:center}
label.lbl{display:block;font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--card2);color:var(--muted)}
.pill.on{background:rgba(60,224,176,.15);color:var(--mint)}
.pill.warn{background:rgba(255,204,77,.15);color:var(--sun)}
.pill.bad{background:rgba(255,92,122,.15);color:var(--coral)}
.hero{padding:22px 0 8px}
.hero .twist{color:var(--coral);font-style:italic}
.modes{display:grid;gap:10px}
.mode{position:relative;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px 16px 16px 72px;cursor:pointer;min-height:84px}
.mode .ic{position:absolute;left:14px;top:16px;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px}
.mode h3{margin-bottom:2px}
.mode .tag{font-size:13px;color:var(--muted)}
.mode.sel{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.mode.sel::after{content:"Selected";position:absolute;right:12px;top:12px;font-size:11px;font-weight:700;color:var(--c);letter-spacing:.04em;text-transform:uppercase}
.c-adv{--c:var(--adv)} .c-mys{--c:var(--mys)} .c-par{--c:var(--par)}
.c-adv .ic{background:rgba(60,224,176,.16)} .c-mys .ic{background:rgba(155,123,255,.18)} .c-par .ic{background:rgba(255,92,122,.16)}
.roomcode{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:clamp(40px,9vw,64px);line-height:1}
.qr{background:#fff;border-radius:14px;padding:8px;display:inline-block;line-height:0}
.qr svg{width:100%;height:auto;display:block}
.players{display:grid;gap:8px}
.pl{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);border-radius:12px;border:1px solid var(--line)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--display);color:#120d24;flex:none;font-size:14px}
.pl .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim)} .dot.on{background:var(--mint)}
.timer{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;font-size:34px;letter-spacing:-.02em}
.timer.low{color:var(--coral)}
.big-timer{font-size:clamp(56px,10vw,96px)}
.rolecard{border-radius:22px;padding:22px;text-align:center;position:relative;overflow:hidden}
.rolecard.explorer{background:linear-gradient(160deg,#1f5a4c,#14372f);border:1px solid #2f8a72}
.rolecard.twister{background:linear-gradient(160deg,#6a1f3a,#3a1024);border:1px solid #b23a62}
.rolecard.caught{background:var(--card);border:1px dashed var(--dim)}
.rolecard .kicker{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.rolecard .rname{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;margin:6px 0 8px}
.badge{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.badge .bc{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.18em}
.feed{display:grid;gap:6px;max-height:260px;overflow:auto}
.feed div{font-size:14px;padding:8px 10px;background:var(--bg2);border-radius:10px;color:var(--muted)}
.feed div:first-child{color:var(--text)}
.bars{display:grid;gap:10px}
.bar{display:grid;gap:6px}
.bar .track{height:14px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px;transition:width .4s ease}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:17px;cursor:pointer;min-height:58px;display:flex;align-items:center;gap:12px}
.opt .k{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--card2);font-family:var(--display);flex:none}
.opt.picked{border-color:var(--sun);background:rgba(255,204,77,.1)}
.opt.picked .k{background:var(--sun);color:#231a00}
.tally .opt{cursor:default}
.prompt{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,40px);line-height:1.08;letter-spacing:-.02em}
.clue{border-left:4px solid var(--violet)}
.clue.solved{border-left-color:var(--mint)}
.digit{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--mint)}
.digits{display:flex;gap:10px;justify-content:center}
.digits span{width:64px;height:78px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:40px}
.digits span.on{color:var(--mint);border-color:var(--mint)}
.frag{padding:12px 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:15px;line-height:1.45}
.frag b{color:var(--violet);font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:4px}
.hint{font-size:14px;padding:10px 12px;background:rgba(255,204,77,.1);border:1px solid rgba(255,204,77,.35);border-radius:10px;color:#ffe3a1}
.banner{border-radius:22px;padding:22px;text-align:center}
.banner.win{background:linear-gradient(150deg,rgba(60,224,176,.25),rgba(92,184,255,.15));border:1px solid rgba(60,224,176,.5)}
.banner.lose{background:linear-gradient(150deg,rgba(255,92,122,.22),rgba(155,123,255,.15));border:1px solid rgba(255,92,122,.5)}
.lb{display:grid;gap:8px}
.lb .pl .sc{font-family:var(--display);font-weight:800;font-size:20px;color:var(--sun)}
.award{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.award .ai{font-size:26px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.chip.on{color:var(--text);border-color:var(--mint)}
.spark{color:var(--sun);font-weight:800}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:var(--text);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;max-width:min(92vw,460px);z-index:60;transition:transform .3s ease;box-shadow:0 10px 30px rgba(0,0,0,.4);text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast.good{background:var(--mint)} .toast.bad{background:var(--coral)}
.scanner{position:fixed;inset:0;background:rgba(8,5,18,.96);z-index:50;display:flex;flex-direction:column;padding:16px;gap:12px}
.scanner video{width:100%;max-width:520px;margin:0 auto;border-radius:18px;background:#000;aspect-ratio:1;object-fit:cover}
.scanner .frame{position:relative;width:100%;max-width:520px;margin:0 auto}
.scanner .frame::after{content:"";position:absolute;inset:18%;border:3px solid var(--sun);border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.25)}
.host-grid{display:grid;gap:16px}
@media (min-width:900px){.host-grid{grid-template-columns:1.1fr .9fr;align-items:start}}
.how h3{margin-bottom:6px}
.how ol{margin:8px 0 0;padding-left:20px;line-height:1.55;color:var(--muted)}
.center{text-align:center}
.err{color:var(--coral);font-size:14px;font-weight:700}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--coral);border-radius:50%;animation:sp 0.8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
